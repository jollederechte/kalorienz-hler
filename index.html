<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teller — Kalorienscanner</title>
<style>
  :root{
    --ink:#2b2620;
    --paper:#faf7f0;
    --card:#ffffff;
    --line:#e6ddc9;
    --accent:#b5551f;
    --accent-soft:#f4e3d3;
    --muted:#8a8070;
    --good:#5c7a4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:96px;
  }
  header{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:26px;
    font-weight:400;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .summary{
    display:flex;
    gap:10px;
    padding:16px 20px;
  }
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
  }
  .stat .label{
    font-size:12px;
    color:var(--muted);
    margin:0 0 4px;
  }
  .stat .value{
    font-family:Georgia,serif;
    font-size:22px;
    margin:0;
  }
  .stat.goal input{
    font-family:Georgia,serif;
    font-size:22px;
    border:none;
    background:transparent;
    width:100%;
    padding:0;
    color:var(--ink);
  }
  .bar-wrap{
    margin:0 20px 20px;
    height:6px;
    background:var(--accent-soft);
    border-radius:3px;
    overflow:hidden;
  }
  .bar{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .section-title{
    padding:0 20px;
    font-size:13px;
    color:var(--muted);
    margin:8px 0;
  }
  .log{
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:center;
  }
  .entry img{
    width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;
    background:var(--accent-soft);
  }
  .entry .info{flex:1; min-width:0;}
  .entry .name{font-size:15px; margin:0 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .meta{font-size:12px; color:var(--muted); margin:0;}
  .entry .kcal{
    font-family:Georgia,serif;
    font-size:17px;
    white-space:nowrap;
  }
  .entry button{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:18px;
    line-height:1;
    padding:4px 6px;
  }
  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .dock{
    position:fixed;
    bottom:0; left:0; right:0;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .scan-btn{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:500;
    padding:15px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .scan-btn:active{opacity:.85;}
  .scan-btn:disabled{opacity:.6;}
  #fileInput{display:none;}

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,16,10,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:Georgia,serif;
    font-weight:400;
    font-size:20px;
    margin:0 0 14px;
  }
  .preview-img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:14px;
    background:var(--accent-soft);
  }
  .status-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:14px;
    padding:8px 0 16px;
  }
  .spinner{
    width:16px;height:16px;
    border:2px solid var(--accent-soft);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .field{margin-bottom:12px;}
  .field label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px;}
  .field input, .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:none; height:44px;}
  .macro-row{display:flex; gap:8px;}
  .macro-row .field{flex:1;}
  .error-text{
    font-size:13px; color:#a83a3a; margin:0 0 10px; display:none;
  }
  .sheet-actions{
    display:flex; gap:10px; margin-top:6px;
  }
  .btn-secondary, .btn-primary{
    flex:1;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:500;
  }
  .btn-secondary{background:var(--card); border:1px solid var(--line); color:var(--ink);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:disabled{opacity:.6;}
</style>
</head>
<body>

<header>
  <h1>Teller</h1>
  <p>Foto machen, Kalorien werden geschätzt.</p>
</header>

<div class="summary">
  <div class="stat">
    <p class="label">Gegessen</p>
    <p class="value" id="eatenVal">0</p>
  </div>
  <div class="stat goal">
    <p class="label">Ziel</p>
    <input type="number" id="goalInput" value="2000" step="50" inputmode="numeric">
  </div>
  <div class="stat">
    <p class="label">Übrig</p>
    <p class="value" id="leftVal">2000</p>
  </div>
</div>
<div class="bar-wrap"><div class="bar" id="bar"></div></div>

<p class="section-title" id="logTitle">Heute</p>
<div class="log" id="log"></div>
<div class="empty" id="emptyState">Noch nichts gegessen heute. Mach ein Foto, um loszulegen.</div>

<div class="dock">
  <button class="scan-btn" id="scanBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/><circle cx="12" cy="12" r="3"/></svg>
    Essen fotografieren
  </button>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment">

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>Mahlzeit prüfen</h2>
    <img class="preview-img" id="previewImg" alt="Foto des Essens">
    <div class="status-row" id="statusRow" style="display:none;">
      <div class="spinner"></div>
      <span>Claude schätzt die Kalorien…</span>
    </div>
    <p class="error-text" id="formError">Bitte Name und Kalorien angeben.</p>
    <div class="field">
      <label for="fName">Gericht</label>
      <input type="text" id="fName" placeholder="z. B. Hähnchen-Bowl">
    </div>
    <div class="macro-row">
      <div class="field">
        <label for="fKcal">Kalorien</label>
        <input type="number" id="fKcal" inputmode="numeric">
      </div>
      <div class="field">
        <label for="fPortion">Portion</label>
        <input type="text" id="fPortion" placeholder="z. B. 1 Teller">
      </div>
    </div>
    <div class="field">
      <label for="fNote">Anmerkung von Claude</label>
      <textarea id="fNote" readonly></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelBtn">Verwerfen</button>
      <button class="btn-primary" id="saveBtn">Eintragen</button>
    </div>
  </div>
</div>

<script>
let entries = [];
let currentImageData = null;

const fileInput = document.getElementById('fileInput');
const scanBtn = document.getElementById('scanBtn');
const overlay = document.getElementById('overlay');
const previewImg = document.getElementById('previewImg');
const statusRow = document.getElementById('statusRow');
const fName = document.getElementById('fName');
const fKcal = document.getElementById('fKcal');
const fPortion = document.getElementById('fPortion');
const fNote = document.getElementById('fNote');
const formError = document.getElementById('formError');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');
const goalInput = document.getElementById('goalInput');

scanBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    currentImageData = reader.result;
    previewImg.src = currentImageData;
    fName.value = '';
    fKcal.value = '';
    fPortion.value = '';
    fNote.value = '';
    formError.style.display = 'none';
    overlay.classList.add('open');
    statusRow.style.display = 'flex';
    saveBtn.disabled = true;
    try {
      await estimateCalories(currentImageData);
    } catch(err) {
      fNote.value = 'Automatische Schätzung nicht möglich — bitte manuell eintragen.';
    } finally {
      statusRow.style.display = 'none';
      saveBtn.disabled = false;
    }
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

async function estimateCalories(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(';'));

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: "Du siehst ein Foto einer Mahlzeit. Schätze die Kalorien. Antworte NUR mit JSON, kein Markdown, kein Preamble, im Format: {\"name\": \"kurzer Gerichtname auf Deutsch\", \"portion\": \"geschätzte Portionsgröße, z.B. '1 Teller' oder '350g'\", \"calories\": ZAHL, \"note\": \"ein kurzer Satz auf Deutsch zur Einschätzung, z.B. welche Zutaten erkannt wurden und warum die Schätzung unsicher sein könnte\"}" }
        ]
      }]
    })
  });
  const data = await response.json();
  const text = data.content.map(b => b.text || "").join("");
  const clean = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);

  fName.value = parsed.name || '';
  fKcal.value = Math.round(parsed.calories) || '';
  fPortion.value = parsed.portion || '';
  fNote.value = parsed.note || '';
}

cancelBtn.addEventListener('click', () => {
  overlay.classList.remove('open');
  currentImageData = null;
});

saveBtn.addEventListener('click', () => {
  const name = fName.value.trim();
  const kcal = Number(fKcal.value);
  if(!name || !kcal || kcal <= 0){
    formError.style.display = 'block';
    return;
  }
  formError.style.display = 'none';
  entries.push({
    name,
    kcal,
    portion: fPortion.value.trim(),
    image: currentImageData
  });
  overlay.classList.remove('open');
  currentImageData = null;
  render();
});

goalInput.addEventListener('input', render);

function render(){
  const goal = Number(goalInput.value) || 0;
  const eaten = entries.reduce((s,e) => s + e.kcal, 0);
  document.getElementById('eatenVal').textContent = eaten;
  document.getElementById('leftVal').textContent = Math.max(goal - eaten, 0);
  const pct = goal > 0 ? Math.min((eaten/goal)*100, 100) : 0;
  document.getElementById('bar').style.width = pct.toFixed(0) + '%';

  const log = document.getElementById('log');
  const empty = document.getElementById('emptyState');
  log.innerHTML = '';
  empty.style.display = entries.length === 0 ? 'block' : 'none';

  entries.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <img src="${e.image || ''}" alt="">
      <div class="info">
        <p class="name">${e.name}</p>
        <p class="meta">${e.portion || ''}</p>
      </div>
      <span class="kcal">${e.kcal} kcal</span>
    `;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.setAttribute('aria-label', 'Entfernen');
    btn.addEventListener('click', () => { entries.splice(i,1); render(); });
    row.appendChild(btn);
    log.appendChild(row);
  });
}

render();
</script>
</body>
</html>
